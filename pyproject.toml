[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "actionable-review-clusterer-20260720"
version = "0.1.0"
description = "Cluster code review comments into actionable work items."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "maxi-maxima"}]

[project.scripts]
reviewcluster = "reviewcluster.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
